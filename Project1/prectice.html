  <!-- Javascript starts here -->
  <script>
    function handleMenu() {
      const navDialog = document.getElementById("nav-dialog")
      if (navDialog.classList.contains("hidden")) {
        navDialog.classList.remove("hidden");
        setTimeout(() => {
          navDialog.classList.remove("-translate-x-full");
          navDialog.classList.add("translate-x-0");
        }, 10);
      } else {
        navDialog.classList.remove("translate-x-0");
        navDialog.classList.add("-translate-x-full");
        setTimeout(() => {
          navDialog.classList.add("hidden");
        }, 300);
      }
    }
  </script>
